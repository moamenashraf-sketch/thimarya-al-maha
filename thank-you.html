<body class="lang-ar">
<header class="scrolled" id="header">
  <div class="wrap nav">
    <a href="index.html" class="nav-logo"><img src="assets/almaha-logo-white.png" alt="المها" /></a>
    <div class="nav-right">
      <button class="lang-toggle" id="langBtn" aria-label="Switch language"><span data-ar="EN" data-en="ع">ع</span></button>
    </div>
  </div>
</header>
<main class="ty">
  <div class="wrap">
    <div class="form-success">
      <div class="tick"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12l4 4L19 6"/></svg></div>
      <h1 data-ar="شكرًا لك" data-en="Thank you">Thank you</h1>
      <p data-ar="تم استلام طلبك وسيتواصل معك فريقنا قريبًا." data-en="Your request has been received. Our team will contact you shortly.">Your request has been received. Our team will contact you shortly.</p>
      <a href="index.html" class="btn btn-primary"><span data-ar="العودة إلى مجتمع المها" data-en="Back to Al Maha">Back to Al Maha</span> <span class="arr">→</span></a>
    </div>
  </div>
</main>
<script>
(function(){
  var lang="ar";
  try{ if(localStorage.getItem('thimarya-lang')==='en') lang='en'; }catch(e){}
  function apply(l){
    lang=l; document.documentElement.lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr';
    document.body.classList.toggle('lang-ar',l==='ar'); document.body.classList.toggle('lang-en',l==='en');
    document.querySelectorAll('[data-ar]').forEach(function(el){ el.innerHTML=el.getAttribute('data-'+l); });
    try{localStorage.setItem('thimarya-lang',l);}catch(e){}
  }
  document.getElementById('langBtn').addEventListener('click',function(){ apply(lang==='ar'?'en':'ar'); });
  apply(lang);
})();
</script>
</body>
</html>
